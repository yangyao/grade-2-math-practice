name: macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build application
        run: bash scripts/build-app.sh
      - name: Package application
        run: ditto -c -k --keepParent 'dist/口算练习.app' 'dist/Grade2MathPractice-macOS.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: Grade2MathPractice-macOS
          path: dist/Grade2MathPractice-macOS.zip

  ipad-build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build iPad simulator app
        run: >-
          xcodebuild -project iPad/Grade2MathPractice.xcodeproj
          -scheme Grade2MathPracticeIPad -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .build/iPad build CODE_SIGNING_ALLOWED=NO
